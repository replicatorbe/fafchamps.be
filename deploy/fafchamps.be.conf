server {
    listen 80;
    server_name fafchamps.be www.fafchamps.be;

    root /var/www/fafchamps.be;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Dossiers internes (scripts cron + token, conf de déploiement) : aucun accès web.
    # Placé avant le bloc .php pour primer sur l'exécution PHP-FPM.
    # ~* (insensible à la casse) : ne pas dépendre de la casse du système de fichiers.
    location ~* ^/(_cron|deploy)/ {
        deny all;
    }

    # Documentation du dépôt : pas de raison de l'exposer publiquement.
    location ~* ^/README\.md$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
