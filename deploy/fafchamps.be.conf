# L'apex répondait 200 : le site entier existait en double, sous deux hôtes, et
# chaque page du blog avait deux adresses. Le <link rel="canonical"> disait
# laquelle compte, mais le mieux est qu'il n'y en ait qu'une. L'apex reste
# déclaré dans VIRTUAL_HOST/LETSENCRYPT_HOST du proxy — c'est lui qui termine le
# TLS et nous repasse la requête en clair avec « Host: fafchamps.be » —, donc ce
# bloc attrape l'apex en HTTP comme en HTTPS et ne fait plus que rediriger.
# Le challenge ACME, lui, est servi par le proxy et n'arrive jamais jusqu'ici :
# le certificat de l'apex continue de se renouveler.
server {
    listen 80;
    server_name fafchamps.be;

    server_tokens off;

    return 301 https://www.fafchamps.be$request_uri;
}

server {
    listen 80;
    server_name www.fafchamps.be;

    root /var/www/fafchamps.be;
    index index.html;

    # Les en-têtes et les pages d'erreur annonçaient « nginx/1.29.3 ».
    # Connaître la version exacte ne sert qu'à celui qui cherche une faille
    # publiée pour cette version-là : on garde « nginx », sans le numéro.
    server_tokens off;

    # Les réponses partaient en « Content-Type: text/html » tout court. Le
    # <meta charset> du document sauvait la mise, mais l'en-tête prime sur la
    # balise : autant que les deux disent la même chose.
    charset utf-8;
    # La liste par défaut oublie le CSS et le SVG ; elle est remplacée en entier
    # (text/html y est de toute façon toujours). application/json n'y figure pas :
    # la norme JSON impose l'UTF-8 et ne prévoit pas de paramètre charset.
    charset_types text/css text/xml text/plain text/vnd.wap.wml
                  application/javascript application/rss+xml
                  application/atom+xml image/svg+xml;

    client_max_body_size 64M;

    # ---- Compression ----
    # La page d'accueil fait ~120 Ko de HTML ; elle en pèse environ 20 une fois
    # compressée. text/html l'est toujours par défaut, les autres types non.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/rss+xml
                      application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/security-headers.inc;

    # Le site est statique : il n'y a pas d'index.php vers lequel se rabattre.
    # L'ancien « try_files … /index.php?$query_string » sortait donc du vhost et
    # c'est le proxy en amont qui répondait, avec sa page blanche à lui. En
    # terminant par « =404 », l'erreur reste ici et error_page peut la traiter.
    location / {
        try_files $uri $uri/ =404;
    }

    # Page 404 maison. Écrit sans le signe « = » : « error_page 404 = /404.html »
    # ferait répondre le code du fichier servi, donc 200, et un moteur
    # indexerait la page d'erreur comme une page ordinaire. Sans le « = », le
    # 404 d'origine est conservé. « internal » interdit d'atteindre /404.html
    # en tapant son adresse : on n'y arrive que par une vraie erreur.
    # Pas de add_header ici : cette location n'en déclare aucun, elle hérite
    # donc de ceux du bloc server — contrairement au bloc des fichiers statiques
    # plus bas, qui en déclare et doit les réinclure.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Dossiers internes (scripts cron + token, sources des publications, conf de
    # déploiement) : aucun accès web. /_posts/ contient le Markdown source des
    # articles — seul le HTML généré dans /blog/ doit être servi.
    # ~* (insensible à la casse) : ne pas dépendre de la casse du système de fichiers.
    # « return 404 » plutôt que « deny all » : un 403 est une réponse différente
    # d'un 404, donc il confirme que le fichier demandé existe. Ici tout répond
    # comme si rien n'était là, et la page 404 maison s'affiche.
    location ~* ^/(_cron|deploy|_posts)/ {
        return 404;
    }

    # Documentation et scripts du dépôt (README.md, PUBLIER.md, DATATION.md,
    # publier.sh) : aucune raison de les exposer publiquement. Les sources des
    # articles sont en .md elles aussi, mais vivent dans /_posts/, déjà traité
    # ci-dessus. /LICENSE n'a pas d'extension : il reste servi, c'est voulu.
    location ~* \.(md|sh)$ {
        return 404;
    }

    location ~ /\.(ht|git|env) {
        return 404;
    }

    # ---- Durées de cache ----
    # Deux régimes, parce que tous les fichiers statiques ne se ressemblent pas.
    #
    # Règles écrites par extension et non par liste de fichiers : de nouvelles
    # images et les premières polices locales arrivent, elles doivent être
    # couvertes sans qu'on y repense.
    #
    # Un seul en-tête de cache : « expires 1y » posait déjà max-age plus un
    # Expires, et le add_header en ajoutait un deuxième Cache-Control à côté.
    # Deux en-têtes de même nom, c'est au navigateur de choisir — autant n'en
    # émettre qu'un, complet.

    # CSS, JS et polices : leur URL porte un numéro de version (site.js?v=13).
    # Changer le fichier change l'adresse, donc « immutable » ne piège personne.
    location ~* \.(css|js|woff2|woff|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Obligatoire : le add_header ci-dessus annule ceux du bloc server.
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Images : leur URL n'est pas versionnée. En « immutable » d'un an, remplacer
    # une image laissait tous les visiteurs déjà venus avec l'ancienne pendant
    # un an, sans aucun moyen de purge. Trente jours puis revalidation : le
    # cache reste efficace et une correction finit par arriver.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
