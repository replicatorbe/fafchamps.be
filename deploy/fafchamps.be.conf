server {
    listen 80;
    server_name fafchamps.be www.fafchamps.be;

    root /var/www/fafchamps.be;
    index index.php index.html;

    # Les en-têtes et les pages d'erreur annonçaient « nginx/1.29.3 ».
    # Connaître la version exacte ne sert qu'à celui qui cherche une faille
    # publiée pour cette version-là : on garde « nginx », sans le numéro.
    server_tokens off;

    client_max_body_size 64M;

    # ---- Compression ----
    # La page d'accueil fait ~120 Ko de HTML ; elle en pèse environ 20 une fois
    # compressée. text/html l'est toujours par défaut, les autres types non.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/rss+xml
                      application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/security-headers.inc;

    # Le site est statique : il n'y a pas d'index.php vers lequel se rabattre.
    # L'ancien « try_files … /index.php?$query_string » sortait donc du vhost et
    # c'est le proxy en amont qui répondait, avec sa page blanche à lui. En
    # terminant par « =404 », l'erreur reste ici et error_page peut la traiter.
    location / {
        try_files $uri $uri/ =404;
    }

    # Page 404 maison. Écrit sans le signe « = » : « error_page 404 = /404.html »
    # ferait répondre le code du fichier servi, donc 200, et un moteur
    # indexerait la page d'erreur comme une page ordinaire. Sans le « = », le
    # 404 d'origine est conservé. « internal » interdit d'atteindre /404.html
    # en tapant son adresse : on n'y arrive que par une vraie erreur.
    # Pas de add_header ici : cette location n'en déclare aucun, elle hérite
    # donc de ceux du bloc server — contrairement au bloc des fichiers statiques
    # plus bas, qui en déclare et doit les réinclure.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Dossiers internes (scripts cron + token, sources des publications, conf de
    # déploiement) : aucun accès web. /_posts/ contient le Markdown source des
    # articles — seul le HTML généré dans /blog/ doit être servi.
    # Placé avant le bloc .php pour primer sur l'exécution PHP-FPM.
    # ~* (insensible à la casse) : ne pas dépendre de la casse du système de fichiers.
    location ~* ^/(_cron|deploy|_posts)/ {
        deny all;
    }

    # Documentation et scripts du dépôt (README.md, PUBLIER.md, publier.sh) :
    # aucune raison de les exposer publiquement. Les sources des articles sont
    # en .md elles aussi, mais vivent dans /_posts/, déjà bloqué ci-dessus.
    location ~* \.(md|sh)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Obligatoire : le add_header ci-dessus annule ceux du bloc server.
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
